<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rania Dridi — Développeuse full-stack</title>
<meta name="description" content="Rania Dridi, développeuse full-stack (React, Go, PostgreSQL) et tests automatisés. Projets, code et contact.">
<meta property="og:title" content="Rania Dridi — Développeuse full-stack">
<meta property="og:description" content="React, Go, PostgreSQL et tests automatisés. Découvrez mes projets.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Palette : échelle violette et neutre de Radix Colors, clair et sombre */
:root{
  --bg:#fefcfe; --bg-subtle:#fbf7fe; --card:#f7f1fd; --border:#e2cbf5; --border-soft:#ebdcf9;
  --solid:#8e4ec6; --solid-hover:#8347b9; --accent-text:#8145b5; --on-solid:#fff;
  --text:#211f26; --text-muted:#6f6e77; --tag-bg:#f2e9fb; --tag-text:#8145b5;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#18111b; --bg-subtle:#1e1523; --card:#301c3b; --border:#54346b; --border-soft:#48295c;
  --solid:#8e4ec6; --solid-hover:#9a5cd0; --accent-text:#d19dff; --on-solid:#fff;
  --text:#ecd9fa; --text-muted:#b4b0bd; --tag-bg:#3d224e; --tag-text:#d19dff;
}}
:root[data-theme="light"]{--bg:#fefcfe;--bg-subtle:#fbf7fe;--card:#f7f1fd;--border:#e2cbf5;--border-soft:#ebdcf9;--solid:#8e4ec6;--solid-hover:#8347b9;--accent-text:#8145b5;--text:#211f26;--text-muted:#6f6e77;--tag-bg:#f2e9fb;--tag-text:#8145b5}
:root[data-theme="dark"]{--bg:#18111b;--bg-subtle:#1e1523;--card:#301c3b;--border:#54346b;--border-soft:#48295c;--solid:#8e4ec6;--solid-hover:#9a5cd0;--accent-text:#d19dff;--text:#ecd9fa;--text-muted:#b4b0bd;--tag-bg:#3d224e;--tag-text:#d19dff}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Sora,Inter,system-ui,sans-serif;line-height:1.2;margin:0}
a{color:var(--accent-text)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
/* animations courtes et discrètes */
a,button,.card,.shot img{transition:background-color .15s,border-color .15s,transform .15s,color .15s}

header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-soft)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.logo{font-family:Sora,sans-serif;font-weight:700;text-decoration:none;color:var(--text)}
nav{display:flex;align-items:center;gap:18px}
nav a{color:var(--text-muted);text-decoration:none;font-size:.95rem}
nav a:hover{color:var(--accent-text)}
.chip{border:1px solid var(--border);background:var(--bg-subtle);color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:.85rem}
.chip:hover{border-color:var(--solid)}

/* Hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:64px 0 40px}
.avatar{width:132px;height:132px;border-radius:50%;background:linear-gradient(135deg,var(--solid),#5c2d91);color:#fff;display:grid;place-items:center;font:700 2.4rem Sora,sans-serif;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:clamp(2rem,5.5vw,3rem)}
.hero .role{font-family:Sora,sans-serif;font-size:clamp(1.1rem,3vw,1.4rem);color:var(--accent-text);margin:6px 0 12px}
.hero p{margin:0 0 20px;color:var(--text-muted);max-width:560px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;padding:9px 16px;border-radius:10px;background:var(--solid);color:var(--on-solid);text-decoration:none;font-weight:600;border:1px solid var(--solid)}
.btn:hover{background:var(--solid-hover)}
.btn.alt{background:transparent;color:var(--accent-text);border-color:var(--border)}
.btn.alt:hover{border-color:var(--solid);background:var(--bg-subtle)}

section{padding:44px 0}
h2{font-size:1.5rem;margin-bottom:6px}
.sub{color:var(--text-muted);margin:0 0 22px}

/* Compétences minimalistes */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.skill{background:var(--bg-subtle);border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px}
.skill b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600;margin-bottom:4px}
.skill span{font-weight:600}

/* Projets */
.projects{display:grid;gap:20px}
.card{background:var(--bg-subtle);border:1px solid var(--border-soft);border-radius:16px;padding:22px}
.card:hover{border-color:var(--border)}
.card.main{border-color:var(--border);background:var(--card)}
.badge{display:inline-block;font-size:.75rem;font-weight:600;background:var(--solid);color:#fff;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.card h3{font-size:1.3rem}
.meta{color:var(--text-muted);font-size:.9rem;margin:4px 0 12px}
.card p{margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{background:var(--tag-bg);color:var(--tag-text);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:14px 0}
.shots img,.cover{width:100%;display:block;border-radius:10px;border:1px solid var(--border-soft)}
.cover{max-width:560px}
.shots a:hover img{transform:translateY(-2px);border-color:var(--solid)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:20px}
.more .card{padding:16px}
.more h3{font-size:1rem}
.more p{font-size:.92rem;color:var(--text-muted);margin:4px 0 8px}

/* Parcours */
.timeline{border-left:2px solid var(--border);margin-left:6px;padding-left:20px;display:grid;gap:18px}
.timeline div b{display:block}
.timeline small{color:var(--text-muted)}
.timeline p{margin:2px 0 0;color:var(--text-muted);font-size:.95rem}

.form{display:grid;gap:10px;max-width:560px;margin-bottom:18px}
.form input,.form textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg-subtle);color:var(--text);font:inherit}
.form input:focus,.form textarea:focus{outline:2px solid var(--solid);border-color:var(--solid)}
.form .btn{justify-self:start;cursor:pointer}
footer{border-top:1px solid var(--border-soft);padding:24px 0;color:var(--text-muted);font-size:.9rem}

@media (max-width:720px){
  .hero{grid-template-columns:1fr;padding-top:40px}
  .avatar{width:96px;height:96px;font-size:1.8rem}
  .cols{grid-template-columns:1fr}
  nav a.hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#top">Rania Dridi</a>
  <nav>
    <a class="hide-sm" href="#projects" data-i="nav_projects"></a>
    <a class="hide-sm" href="#about" data-i="nav_about"></a>
    <a href="#contact" data-i="nav_contact"></a>
    <button class="chip" id="lang" aria-label="Language">EN</button>
  </nav>
</div></header>

<main class="wrap" id="top">

  <section id="skills">

  <section id="services">

  <section id="projects">

    <p class="sub" data-i="projects_sub"></p>
    <div class="projects" id="projectList"></div>
    <div class="more" id="moreList"></div>
  </section>

  <section id="about">

    <div class="timeline" id="timeline"></div>
  </section>

  <section id="contact">

    <p class="sub" data-i="contact_text"></p>

      <input id="fEmail" type="email" required autocomplete="email">

</main>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang = 'fr';
try { const s = localStorage.getItem('lang'); if (s === 'fr' || s === 'en') lang = s; } catch(e){}

function btn(href, label, alt){ return href ? `<a class="btn${alt?' alt':''}" href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>` : ''; }

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t[e.dataset.i]);
  document.getElementById('lang').textContent = lang === 'fr' ? 'EN' : 'FR';

  const av = document.getElementById('avatar');
  av.innerHTML = L.photo ? `<img src="${esc(L.photo)}" alt="Rania Dridi">` : 'RD';

  const mail = L.email ? 'mailto:' + L.email : '';
  const row = btn(mail, t.mail) + btn(L.cv, t.cv, true) + btn(L.linkedin, t.li, true) + btn(L.github, t.gh, true);
  document.getElementById('heroBtns').innerHTML = row;
  document.getElementById('contactBtns').innerHTML = row;

  document.getElementById('svcGrid').innerHTML = t.svc.map(s => `<div class="skill"><b>${esc(s[0])}</b><span style="font-weight:400;color:var(--text-muted)">${esc(s[1])}</span></div>`).join('');

  document.getElementById('fEmail').placeholder = t.f_email;
  document.getElementById('fMsg').placeholder = t.f_msg;
  document.getElementById('fSend').textContent = t.f_send;

  document.getElementById('skillGrid').innerHTML = t.skills.map(s => `<div class="skill"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('');

  document.getElementById('projectList').innerHTML = t.p.map(p => `
    <article class="card${p.main?' main':''}">

      <h3>${esc(p.t)}</h3><p class="meta">${esc(p.m)}</p>
      <p>${esc(p.d)}</p>
      ${p.b?`<ul>${p.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      ${p.shots?`<div class="shots">${p.shots.map(n=>`<a href="assets/${esc(n)}.png" target="_blank" rel="noopener"><img src="assets/${esc(n)}.png" alt="${esc(p.t)}" loading="lazy"></a>`).join('')}</div>`:''}
      ${p.img?`<img class="cover" src="${esc(p.img)}" alt="${esc(p.t)}" loading="lazy">`:''}
      <div class="tags">${p.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
      <div class="links">${p.links.map((l,i)=>btn(l[1], l[0], i>0)).join('')}</div>

    <div class="card"><h3>${esc(m.t)}</h3><p>${esc(m.d)}</p>${m.link?`<a href="${esc(m.link[1])}" target="_blank" rel="noopener">${esc(m.link[0])} →</a>`:''}</div>`).join('');

  document.getElementById('timeline').innerHTML = t.about.map(a => `<div><small>${esc(a[0])}</small><b>${esc(a[1])}</b><p>${esc(a[2])}</p></div>`).join('');
}
document.getElementById('lang').onclick = () => {
  lang = lang === 'fr' ? 'en' : 'fr';
  try { localStorage.setItem('lang', lang); } catch(e){}
  render();
};
document.getElementById('contactForm').addEventListener('submit', e => {

});

render();
</script>
