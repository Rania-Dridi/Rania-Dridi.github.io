<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Rania Dridi, développeuse full-stack (React, Go, PostgreSQL, Laravel). Projets et contact.">
<meta property="og:title" content="Rania Dridi — Développeuse full-stack">
<meta property="og:description" content="Interfaces, API, paiement, IA et tests automatisés. Découvrez mes projets.">
<meta property="og:type" content="website">
<title>Rania Dridi — Développeuse full-stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Concept : agence éditoriale monochrome. Charbon et blanc, Bebas Neue géant, tuiles carrées, un seul accent rose */
:root{
  color-scheme:dark;
  --bg:#1b1b1b; --bg-2:#232323; --line:#3b3b3b; --text:#ffffff; --soft:#cccccc; --muted:#909090; --accent:#ff9db8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:300 17px/1.7 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.06em;line-height:1.02;margin:0}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a,button,.tile,.tile *{transition:background-color .15s,border-color .15s,color .15s,opacity .15s,transform .15s}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font:400 1.9rem "Bebas Neue",sans-serif;letter-spacing:.08em;color:var(--text);text-decoration:none}
.logo b{color:var(--accent);font-weight:400}
nav{display:flex;align-items:center;gap:26px}
nav a{color:var(--soft);text-decoration:none;font-size:.82rem;text-transform:uppercase;letter-spacing:.16em}
nav a:hover{color:var(--accent)}
.chip{border:1px solid var(--line);background:transparent;color:var(--soft);padding:4px 12px;cursor:pointer;font:inherit;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.chip:hover{border-color:var(--accent);color:var(--accent)}

.btn{display:inline-block;padding:14px 30px;border:1px solid #fff;color:#fff;background:transparent;text-decoration:none;text-transform:uppercase;letter-spacing:.18em;font:400 .82rem Roboto,sans-serif;cursor:pointer}
.btn:hover{background:#fff;color:var(--bg)}
.btn.fill{background:#fff;color:var(--bg)}
.btn.fill:hover{background:var(--accent);border-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:14px}

/* Hero plein cadre */
.hero{background:
  radial-gradient(circle at 18% 28%,rgba(255,157,184,.42),transparent 42%),
  radial-gradient(circle at 82% 70%,rgba(255,210,225,.26),transparent 38%),
  radial-gradient(circle at 55% 10%,rgba(255,157,184,.18),transparent 30%),
  #1f1b1c;
  border-bottom:1px solid var(--line)}
.hero .wrap{padding-block:clamp(64px,11vw,140px) clamp(56px,8vw,100px)}
.eyebrow{display:block;font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:18px}
.hero h1{font-size:clamp(3.4rem,11vw,9rem);letter-spacing:.07em;max-width:15ch;margin-bottom:26px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:560px;color:var(--soft);margin:0 0 34px;font-size:1.08rem}

section{padding-block:clamp(56px,8vw,104px)}
.head{margin-bottom:38px}
.head h2{font-size:clamp(2.8rem,8vw,6.2rem);letter-spacing:.07em;color:#eaeaea}
.head p{color:var(--muted);margin:8px 0 0}

/* À votre service */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border-top:1px solid var(--line)}
.svc div{padding:28px 26px 30px 0;border-bottom:1px solid var(--line)}
.svc b{display:block;font:400 1.7rem "Bebas Neue",sans-serif;letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase}
.svc span{color:var(--muted);font-size:.98rem}

/* Tuiles carrées */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{position:relative;aspect-ratio:16/11;border:0;padding:0;margin:0;background:var(--bg-2);overflow:hidden;cursor:pointer;color:inherit;font:inherit;text-align:left;display:block}
.tile.big{grid-column:span 2;aspect-ratio:auto}
.tile .art{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.tile .art img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.tile:hover .art{transform:scale(1.04)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:80px 20px 16px;background:linear-gradient(transparent,rgba(0,0,0,.9) 70%)}
.tile .cap small{display:block;color:var(--accent);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase}
.tile .cap h3{font-size:clamp(1.5rem,2.4vw,2rem);letter-spacing:.07em}
.tile.big .cap h3{font-size:clamp(2rem,4vw,3.2rem)}
.tile:hover .cap h3{color:var(--accent)}
.term{width:100%;height:100%;background:#101010;font:400 .74rem/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:#c9c9c9;padding:22px 20px 90px;overflow:hidden;white-space:pre;display:block;text-align:left}
.term .k{color:var(--accent)}.term .g{color:#8fd9a8}.term .m{color:#7d7d7d}
.roles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:20px 20px 80px}
.roles span{border:1px solid rgba(255,255,255,.45);padding:6px 16px;font:400 1.2rem "Bebas Neue",sans-serif;letter-spacing:.1em;color:#fff;text-transform:uppercase}

/* Détail */
dialog{border:1px solid var(--line);background:var(--bg-2);color:var(--text);padding:0;width:min(900px,calc(100% - 24px));max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.8)}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:26px 30px 0}
.dhead h3{font-size:clamp(2rem,5vw,3rem)}
.x{border:1px solid var(--line);background:transparent;color:#fff;width:40px;height:40px;cursor:pointer;font-size:1.1rem;flex:none}
.x:hover{border-color:var(--accent);color:var(--accent)}
.dbody{padding:16px 30px 34px;display:grid;gap:18px}
.dbody p{margin:0;color:var(--soft)}
.dbody ul{margin:0;padding-left:20px}
.dbody li{margin-bottom:6px;color:var(--soft)}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.shots img,.dbody .one{width:100%;display:block;border:1px solid var(--line)}
.shots img{aspect-ratio:16/10;object-fit:cover;object-position:top}
.dbody .one{max-width:640px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);padding:3px 14px;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;border-top:1px solid var(--line);padding-top:16px}
.meta small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.meta span{font-weight:400}

/* Compétences */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:30px 40px}
.skills h3{font-size:1.5rem;color:var(--accent);margin-bottom:12px;letter-spacing:.1em}
.skills ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.skills li{padding:7px 0;border-bottom:1px solid var(--line);color:var(--soft)}

/* Contact */
.contact h2{font-size:clamp(3rem,10vw,8rem);letter-spacing:.07em;margin-bottom:16px}
.contact p{color:var(--soft);max-width:520px;margin:0 0 30px}
.mailline{margin-top:26px!important;color:#fff!important;font-size:1.05rem}
.mailline #mailText{user-select:all}
footer{border-top:1px solid var(--line);padding-block:30px}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px 30px;align-items:center;justify-content:space-between;color:var(--muted);font-size:.85rem}
footer .logo{font-size:1.5rem}

@media (max-width:860px){
  .grid{grid-template-columns:1fr}
  .tile{aspect-ratio:16/10}
  nav a.hide-sm{display:none}
}
@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .tile.big{grid-column:auto;aspect-ratio:1}
  .dhead,.dbody{padding-left:18px;padding-right:18px}
  .svc div{padding-right:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#top">Rania <b>Dridi</b></a>
  <nav>
    <a class="hide-sm" href="#services" data-i="n_services"></a>
    <a class="hide-sm" href="#portfolio" data-i="n_portfolio"></a>
    <a class="hide-sm" href="#skills" data-i="n_skills"></a>
    <a href="#contact" data-i="n_contact"></a>
    <button class="chip" id="lang" type="button" aria-label="Language">EN</button>
  </nav>
</div></header>

<main id="top">
  <div class="hero"><div class="wrap">
    <span class="eyebrow" data-i="eyebrow"></span>
    <h1 id="h1"></h1>
    <p data-i="intro"></p>
    <div class="btns" id="heroBtns"></div>
  </div></div>

  <section id="services"><div class="wrap">
    <div class="head"><h2 data-i="svc_t"></h2></div>
    <div class="svc" id="svc"></div>
  </div></section>

  <section id="portfolio"><div class="wrap">
    <div class="head"><h2 data-i="port_t"></h2><p data-i="port_p"></p></div>
    <div class="grid" id="grid"></div>
  </div></section>

  <section id="skills"><div class="wrap">
    <div class="head"><h2 data-i="skills_t"></h2></div>
    <div class="skills" id="skillGrid"></div>
  </div></section>

  <section id="contact"><div class="wrap contact">
    <h2 data-i="c_t"></h2>
    <p data-i="c_p"></p>
    <div class="btns" id="contactBtns"></div>
    <p class="mailline"><span id="mailText"></span> <button class="chip" id="copyMail" type="button"></button></p>
  </div></section>
</main>

<footer><div class="wrap">
  <a class="logo" href="#top">Rania <b>Dridi</b></a>
  <span>© <span id="yr"></span> Rania Dridi</span>
  <a class="btn" href="#contact" id="hire"></a>
</div></footer>

<dialog id="dlg" aria-labelledby="dTitle">
  <div class="dhead"><h3 id="dTitle"></h3><button class="x" id="dClose" type="button" aria-label="Fermer">✕</button></div>
  <div class="dbody" id="dBody"></div>
</dialog>

<script>
const L = {
  linkedin:"https://www.linkedin.com/in/rania-dridi-a5a733397/",
  email:"randridi131117@gmail.com",
  cv:""
};

const UI = {
fr:{
  n_services:"Services", n_portfolio:"Projets", n_skills:"Compétences", n_contact:"Contact",
  eyebrow:"Développeuse full-stack · Tests automatisés",
  h1:'Vous recherchez une <em>développeuse</em> full-stack ?',
  intro:"Diplômée en Informatique de Gestion (Esprit School of Business, 2026). Je conçois des applications web complètes : interfaces, API, paiement, e-mail, IA et tests automatisés.",
  see:"Voir mes projets", write:"Me contacter", linkedin:"LinkedIn", cv:"Mon CV", hire:"Me recruter",
  svc_t:"Ce que je fais",
  svc:[["Développement full-stack","Interfaces React, API Go, Java ou PHP, bases PostgreSQL et MySQL : de la maquette à la mise en ligne."],["API et intégrations","Paiement en ligne, e-mails, médias et IA branchés proprement sur votre application."],["Tests automatisés","Tests d'API, d'intégration et de bout en bout pour livrer sans régression."],["Analyse de données","Nettoyage, indicateurs et graphiques pour décider sur des chiffres fiables."]],
  port_t:"Projets", port_p:"Cliquez sur un projet pour voir les détails.",
  skills_t:"Compétences",
  c_t:"Un nouveau projet ?", c_p:"Un poste en développement full-stack ou en automatisation de tests ? Écrivez-moi, je réponds vite.",
  copy:"Copier", copied:"Copié", tech:"Développé avec", date:"Date", cat:"Catégorie", ctx:"Contexte"
},
en:{
  n_services:"Services", n_portfolio:"Projects", n_skills:"Skills", n_contact:"Contact",
  eyebrow:"Full-stack developer · Test automation",
  h1:'Looking for a full-stack <em>developer</em>?',
  intro:"Business Information Systems graduate (Esprit School of Business, 2026). I build complete web applications: interfaces, APIs, payments, email, AI and automated tests.",
  see:"See my projects", write:"Contact me", linkedin:"LinkedIn", cv:"My CV", hire:"Hire me",
  svc_t:"What I do",
  svc:[["Full-stack development","React interfaces, Go, Java or PHP APIs, PostgreSQL and MySQL databases: from mock-up to launch."],["APIs and integrations","Online payment, email, media and AI plugged cleanly into your application."],["Test automation","API, integration and end-to-end tests to ship without regressions."],["Data analysis","Cleaning, indicators and charts to decide on reliable numbers."]],
  port_t:"Projects", port_p:"Click a project to see the details.",
  skills_t:"Skills",
  c_t:"Have a new project?", c_p:"A full-stack development or test automation role? Write to me, I reply fast.",
  copy:"Copy", copied:"Copied", tech:"Built with", date:"Date", cat:"Category", ctx:"Context"
}};

const SKILLS = [
  ["Langages","Languages",["TypeScript","JavaScript","Go","Java","PHP","Python","SQL","C#"]],
  ["Frameworks","Frameworks",["React","Angular","Gin","Spring Boot","Laravel","Tailwind CSS",".NET"]],
  ["Bases de données","Databases",["PostgreSQL","MySQL","Neon"]],
  ["Tests et qualité","Testing & quality",["Playwright","Selenium","pytest","Postman","Newman"]],
  ["Données et BI","Data & BI",["pandas","scikit-learn","Power BI","CRISP-DM"]],
  ["Conception et outils","Design & tools",["UML","BPMN","MVC","Git","Vite","Android Studio"]]
];

const P = [
 {id:"wledi", img:"assets/wledi-home.png", shots:["wledi-home","wledi-courses","wledi-student","wledi-admin"],
  t:{fr:"Wledi Academy et Wledi Parent",en:"Wledi Academy and Wledi Parent"},
  cat:{fr:"Plateforme e-learning · PFE",en:"E-learning platform · Final-year project"},
  d:{fr:"Digitalisation de la gestion pédagogique pour les élèves, parents, professeurs, écoles et administrateurs, réalisée pendant mon PFE chez Audasoft Technology.",en:"Digitalisation of academic management for students, parents, teachers, schools and administrators, built during my final-year project at Audasoft Technology."},
  b:{fr:["Interfaces React 18 et TypeScript par rôle (élève, parent, professeur, école, admin).","API Go et Gin en couches Router, Handler, Service, Repository, sur PostgreSQL.","Paiement iPay.tn, e-mails Brevo, médias Cloudinary et assistant IA via Groq.","Tests d'intégration Go, tests d'API Newman et tests de bout en bout Playwright."],
     en:["React 18 and TypeScript interfaces per role (student, parent, teacher, school, admin).","Go and Gin API in layers Router, Handler, Service, Repository, on PostgreSQL.","iPay.tn payments, Brevo email, Cloudinary media and an AI assistant through Groq.","Go integration tests, Newman API tests and Playwright end-to-end tests."]},
  tech:["React","TypeScript","Go","Gin","PostgreSQL","Playwright"], date:{fr:"Février à juin 2026",en:"February to June 2026"}, client:"Audasoft Technology"},
 {id:"crisp", img:"assets/monthly_revenue.png",
  t:{fr:"Analyse des revenus",en:"Revenue analysis"}, cat:{fr:"Analyse de données",en:"Data analysis"},
  d:{fr:"Nettoyage de données de ventes, calcul des indicateurs (chiffre d'affaires, panier moyen, dépendance aux gros clients) et graphiques, en suivant les six phases de CRISP-DM.",en:"Cleaning of sales data, computation of indicators (revenue, average order value, dependence on top customers) and charts, following the six CRISP-DM phases."},
  tech:["Python","pandas","matplotlib","CRISP-DM"], date:{fr:"Cursus 2023 – 2026",en:"Degree 2023 – 2026"}, client:"Esprit School of Business"},
 {id:"freelance", img:"assets/fl-missions.png", shots:["fl-home","fl-missions","fl-apply","fl-freelance","fl-proposals","fl-client","fl-admin"],
  t:{fr:"FreelancePro, freelances et clients",en:"FreelancePro, freelancers and clients"}, cat:{fr:"Application web · Laravel",en:"Web application · Laravel"},
  d:{fr:"Plateforme de mise en relation : les clients publient des missions, les freelances candidatent, le client accepte une candidature et l'administrateur supervise. Application fonctionnelle avec trois rôles.",en:"Matching platform: clients publish missions, freelancers apply, the client accepts one proposal and an administrator supervises. Working application with three roles."},
  b:{fr:["Accès par rôle (client, freelance, administrateur) vérifié côté serveur.","Une seule candidature par freelance et par mission, contrainte en base.","Acceptation d'une candidature en transaction : les autres sont refusées et la mission passe en cours.","Recherche, filtre par catégorie, pagination et tableaux de bord par rôle."],
     en:["Role-based access (client, freelancer, administrator) enforced on the server.","One proposal per freelancer and mission, enforced in the database.","Accepting a proposal runs in a transaction: the others are rejected and the mission moves to in progress.","Search, category filter, pagination and a dashboard per role."]},
  tech:["PHP","Laravel","Eloquent","SQLite / MySQL","Blade"], date:{fr:"Cursus 2023 – 2026",en:"Degree 2023 – 2026"}, client:"Esprit School of Business"},

];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang = 'fr';
try { const s = localStorage.getItem('lang'); if (s === 'fr' || s === 'en') lang = s; } catch(e){}

function art(p){
  if (p.term) return `<span class="term">${p.term}</span>`;
  if (p.roles) return `<div class="roles">${p.roles.map(r=>`<span>${r}</span>`).join('')}</div>`;
  return `<img src="${esc(p.img)}" alt="" loading="lazy">`;
}

function render(){
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = u[e.dataset.i]);
  document.getElementById('h1').innerHTML = u.h1;
  document.getElementById('hire').textContent = u.hire;
  document.getElementById('lang').textContent = lang === 'fr' ? 'EN' : 'FR';

  document.getElementById('heroBtns').innerHTML = `<a class="btn fill" href="#portfolio">${esc(u.see)}</a><a class="btn" href="#contact">${esc(u.write)}</a>`;
  const cv = L.cv ? `<a class="btn" href="${esc(L.cv)}" target="_blank" rel="noopener">${esc(u.cv)}</a>` : '';
  document.getElementById('contactBtns').innerHTML = `<a class="btn fill" href="${esc(L.linkedin)}" target="_blank" rel="noopener">${esc(u.linkedin)}</a>${cv}`;
  document.getElementById('mailText').textContent = L.email;
  document.getElementById('copyMail').textContent = u.copy;

  document.getElementById('svc').innerHTML = u.svc.map(s => `<div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('');

  document.getElementById('grid').innerHTML = P.map(p => `
    <button class="tile${p.big?' big':''}" type="button" data-id="${p.id}">
      <span class="art" ${p.bg?`style="background:${p.bg}"`:''}>${art(p)}</span>
      <span class="cap"><small>${esc(p.cat[lang])}</small><h3>${esc(p.t[lang])}</h3></span>
    </button>`).join('');

  document.getElementById('skillGrid').innerHTML = SKILLS.map(s => `<div><h3>${esc(lang==='fr'?s[0]:s[1])}</h3><ul>${s[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
}

function openProject(id){
  const p = P.find(x => x.id === id), u = UI[lang];
  document.getElementById('dTitle').textContent = p.t[lang];
  const media = p.shots
    ? `<div class="shots">${p.shots.map(n=>`<a href="assets/${esc(n)}.png" target="_blank" rel="noopener"><img src="assets/${esc(n)}.png" alt="${esc(p.t[lang])}" loading="lazy"></a>`).join('')}</div>`
    : (p.img ? `<img class="one" src="${esc(p.img)}" alt="${esc(p.t[lang])}">` : '');
  document.getElementById('dBody').innerHTML = `
    ${media}
    <p>${esc(p.d[lang])}</p>
    ${p.b ? `<ul>${p.b[lang].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    <div class="pills">${p.tech.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>
    <div class="meta">
      <div><small>${esc(u.cat)}</small><span>${esc(p.cat[lang])}</span></div>
      <div><small>${esc(u.date)}</small><span>${esc(p.date[lang])}</span></div>
      <div><small>${esc(u.ctx)}</small><span>${esc(p.client)}</span></div>
    </div>`;
  const d = document.getElementById('dlg');
  if (d.showModal) d.showModal(); else d.setAttribute('open','');
}

document.getElementById('grid').addEventListener('click', e => {
  const b = e.target.closest('.tile'); if (b) openProject(b.dataset.id);
});
const dlg = document.getElementById('dlg');
document.getElementById('dClose').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
document.getElementById('lang').onclick = () => {
  lang = lang === 'fr' ? 'en' : 'fr';
  try { localStorage.setItem('lang', lang); } catch(e){}
  render();
};
document.getElementById('copyMail').addEventListener('click', async () => {
  const el = document.getElementById('copyMail');
  try { await navigator.clipboard.writeText(L.email); el.textContent = UI[lang].copied; }
  catch(e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('mailText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
});
document.getElementById('yr').textContent = new Date().getFullYear();
render();
</script>

</body>
</html>
