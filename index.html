<style>
/* Concept : agence éditoriale monochrome. Charbon et blanc, Bebas Neue géant, tuiles carrées, un seul accent rose */
:root{
  color-scheme:dark;
  --bg:#1b1b1b; --bg-2:#232323; --line:#3b3b3b; --text:#ffffff; --soft:#cccccc; --muted:#909090; --accent:#ff9db8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:300 17px/1.7 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.06em;line-height:1.02;margin:0}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a,button,.tile,.tile *{transition:background-color .15s,border-color .15s,color .15s,opacity .15s,transform .15s}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font:400 1.9rem "Bebas Neue",sans-serif;letter-spacing:.08em;color:var(--text);text-decoration:none}
.logo b{color:var(--accent);font-weight:400}
nav{display:flex;align-items:center;gap:26px}
nav a{color:var(--soft);text-decoration:none;font-size:.82rem;text-transform:uppercase;letter-spacing:.16em}
nav a:hover{color:var(--accent)}
.chip{border:1px solid var(--line);background:transparent;color:var(--soft);padding:4px 12px;cursor:pointer;font:inherit;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.chip:hover{border-color:var(--accent);color:var(--accent)}

.btn{display:inline-block;padding:14px 30px;border:1px solid #fff;color:#fff;background:transparent;text-decoration:none;text-transform:uppercase;letter-spacing:.18em;font:400 .82rem Roboto,sans-serif;cursor:pointer}
.btn:hover{background:#fff;color:var(--bg)}
.btn.fill{background:#fff;color:var(--bg)}
.btn.fill:hover{background:var(--accent);border-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:14px}

/* Hero plein cadre */
.hero{background:
  radial-gradient(circle at 18% 28%,rgba(255,157,184,.42),transparent 42%),
  radial-gradient(circle at 82% 70%,rgba(255,210,225,.26),transparent 38%),
  radial-gradient(circle at 55% 10%,rgba(255,157,184,.18),transparent 30%),
  #1f1b1c;
  border-bottom:1px solid var(--line)}
.hero .wrap{padding-block:clamp(64px,11vw,140px) clamp(56px,8vw,100px)}
.eyebrow{display:block;font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:18px}
.hero h1{font-size:clamp(3.4rem,11vw,9rem);letter-spacing:.07em;max-width:15ch;margin-bottom:26px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:560px;color:var(--soft);margin:0 0 34px;font-size:1.08rem}

section{padding-block:clamp(56px,8vw,104px)}
.head{margin-bottom:38px}
.head h2{font-size:clamp(2.8rem,8vw,6.2rem);letter-spacing:.07em;color:#eaeaea}
.head p{color:var(--muted);margin:8px 0 0}

/* À votre service */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border-top:1px solid var(--line)}
.svc div{padding:28px 26px 30px 0;border-bottom:1px solid var(--line)}
.svc b{display:block;font:400 1.7rem "Bebas Neue",sans-serif;letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase}
.svc span{color:var(--muted);font-size:.98rem}

/* Tuiles carrées */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{position:relative;aspect-ratio:16/11;border:0;padding:0;margin:0;background:var(--bg-2);overflow:hidden;cursor:pointer;color:inherit;font:inherit;text-align:left;display:block}
.tile.big{grid-column:span 2;aspect-ratio:auto}
.tile .art{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.tile .art img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.tile:hover .art{transform:scale(1.04)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:80px 20px 16px;background:linear-gradient(transparent,rgba(0,0,0,.9) 70%)}
.tile .cap small{display:block;color:var(--accent);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase}
.tile .cap h3{font-size:clamp(1.5rem,2.4vw,2rem);letter-spacing:.07em}
.tile.big .cap h3{font-size:clamp(2rem,4vw,3.2rem)}
.tile:hover .cap h3{color:var(--accent)}
.term{width:100%;height:100%;background:#101010;font:400 .74rem/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:#c9c9c9;padding:22px 20px 90px;overflow:hidden;white-space:pre;display:block;text-align:left}
.term .k{color:var(--accent)}.term .g{color:#8fd9a8}.term .m{color:#7d7d7d}
.roles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:20px 20px 80px}
.roles span{border:1px solid rgba(255,255,255,.45);padding:6px 16px;font:400 1.2rem "Bebas Neue",sans-serif;letter-spacing:.1em;color:#fff;text-transform:uppercase}

/* Détail */
dialog{border:1px solid var(--line);background:var(--bg-2);color:var(--text);padding:0;width:min(900px,calc(100% - 24px));max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.8)}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:26px 30px 0}
.dhead h3{font-size:clamp(2rem,5vw,3rem)}
.x{border:1px solid var(--line);background:transparent;color:#fff;width:40px;height:40px;cursor:pointer;font-size:1.1rem;flex:none}
.x:hover{border-color:var(--accent);color:var(--accent)}
.dbody{padding:16px 30px 34px;display:grid;gap:18px}
.dbody p{margin:0;color:var(--soft)}
.dbody ul{margin:0;padding-left:20px}
.dbody li{margin-bottom:6px;color:var(--soft)}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.shots img,.dbody .one{width:100%;display:block;border:1px solid var(--line)}
.shots img{aspect-ratio:16/10;object-fit:cover;object-position:top}
.dbody .one{max-width:640px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);padding:3px 14px;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;border-top:1px solid var(--line);padding-top:16px}
.meta small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.meta span{font-weight:400}

.tile .live{position:absolute;top:12px;right:12px;background:var(--accent);color:#1b1b1b;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;font-weight:500;z-index:1}
.demo{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--line);padding:14px 16px;background:var(--bg)}
.demo p{margin:0;font-size:.9rem;color:var(--muted);flex:1;min-width:200px}
.shot{border:0;padding:0;background:none;cursor:zoom-in;display:block}
.shot img{transition:border-color .15s,transform .15s}
.shot:hover img{border-color:var(--accent);transform:translateY(-2px)}
dialog.lightbox{width:min(1200px,calc(100% - 16px));max-height:96vh;padding:12px;display:none;background:#0f0f0f;border:1px solid var(--line);overflow:auto}
dialog.lightbox[open]{display:block}
.lightbox img{display:block;max-width:100%;max-height:82vh;margin:0 auto}
.lightbox .x{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6)}
.lbbar{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px;color:var(--soft)}
.lbbar .x{position:static}
/* Hero v3: maquettes, preuves, pourquoi moi */
.herogrid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.8rem,5.6vw,5.4rem);max-width:16ch}
.avail{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);padding:5px 14px;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:18px;background:rgba(0,0,0,.25)}
.avail i{width:8px;height:8px;border-radius:50%;background:#58e08a;box-shadow:0 0 0 4px rgba(88,224,138,.18)}
.mock{position:relative;min-height:430px}
.frame{position:absolute;border:1px solid var(--line);background:#0b0b0b;box-shadow:0 30px 70px rgba(0,0,0,.55);overflow:hidden}
.frame .bar{height:26px;background:#141414;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:.66rem;color:var(--muted);letter-spacing:.04em}
.frame .bar i{width:8px;height:8px;border-radius:50%;background:#3a3a3a}
.frame .bar i:first-child{background:var(--accent)}
.frame img{display:block;width:100%}
.f1{width:80%;top:0;left:0;transform:rotate(-2deg)}
.f2{width:66%;top:140px;right:0;transform:rotate(2deg)}
.f3{width:56%;bottom:0;left:8%;transform:rotate(-1deg)}
.proof{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.proof div{padding:22px 20px 24px 0}
.proof b{display:block;font:400 clamp(2.4rem,5vw,3.6rem)/1 "Bebas Neue",sans-serif;letter-spacing:.05em;color:var(--accent)}
.proof span{color:var(--soft);font-size:.92rem}
.btn.sm{padding:9px 18px;font-size:.72rem}
.mailrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px;font-size:1.05rem}
.mailrow #mailText{user-select:all;font-weight:400;color:#fff}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer;padding:0}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn.ok{border-color:#58e08a;color:#58e08a}
.iconbtn svg{display:block}
#why .svc b{color:#fff}
/* v4: panneau de contact, icones de copie, finitions */
html{scroll-padding-top:76px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.who{display:block;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.crow{display:grid;grid-template-columns:44px 1fr auto 38px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.crow:first-child{border-top:1px solid var(--line)}
.cic{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);color:var(--accent)}
.ctxt{min-width:0}
.ctxt small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.ctxt span{display:block;color:#fff;overflow-wrap:anywhere}
.clist{margin:6px 0 20px}
.iconbtn{position:relative}
.iconbtn.ok::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);right:0;background:#58e08a;color:#10130a;font-size:.72rem;font-weight:500;letter-spacing:.06em;padding:3px 9px;white-space:nowrap}
dialog.cdlg{width:min(620px,calc(100% - 24px))}
.contactwrap{max-width:720px}
.flinks{display:flex;gap:18px;flex-wrap:wrap}
.flinks a{color:var(--soft);text-decoration:none;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase}
.flinks a:hover{color:var(--accent)}
@media (max-width:560px){
  .crow{grid-template-columns:44px 1fr 38px}
  .crow .btn{grid-column:1 / -1;text-align:center}
}
/* v5: ecran d'intro RD et formulaire de contact */
#splash{position:fixed;inset:0;z-index:200;background:#1b1b1b;display:grid;place-items:center;transition:transform .75s cubic-bezier(.77,0,.18,1)}
#splash.out{transform:translateY(-100%)}
#splash .mono{display:flex;gap:.04em;font:400 clamp(8rem,34vw,19rem)/.86 "Bebas Neue",sans-serif;letter-spacing:.04em;overflow:hidden;padding-top:.04em}
#splash .mono span{display:block;transform:translateY(112%);animation:rise .75s cubic-bezier(.22,1,.36,1) forwards;color:#fff}
#splash .mono span:nth-child(2){animation-delay:.14s;color:var(--accent)}
#splash .bar{position:absolute;left:50%;bottom:24%;height:2px;width:0;background:var(--accent);transform:translateX(-50%);animation:grow .9s .55s cubic-bezier(.22,1,.36,1) forwards}
#splash .tag{position:absolute;bottom:17%;left:0;right:0;text-align:center;font-size:.78rem;letter-spacing:.34em;text-transform:uppercase;color:var(--soft);opacity:0;animation:fadein .5s .85s forwards}
@keyframes rise{to{transform:none}}
@keyframes grow{to{width:min(260px,56vw)}}
@keyframes fadein{to{opacity:1}}
body.splashing{overflow:hidden}
.cgrid{display:grid;grid-template-columns:1.25fr .75fr;gap:34px;align-items:start}
.cform{border:1px solid var(--line);background:var(--bg-2);padding:clamp(20px,3vw,34px);position:relative}
.cform h3{font-size:1.8rem;margin-bottom:4px}
.cform .sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.fld{margin-bottom:16px;min-width:0}
.fld label,.fld .lab{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;background:#1b1b1b;color:#fff;border:1px solid var(--line);padding:12px 14px;font:inherit;border-radius:0}
.fld textarea{min-height:150px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,157,184,.15)}
.fld.bad input,.fld.bad textarea{border-color:#ff6b6b}
.ferr{display:block;min-height:1.1em;color:#ff8f8f;font-size:.8rem;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.reasons{display:flex;flex-wrap:wrap;gap:8px}
.reasons label{position:relative;margin:0;cursor:pointer}
.reasons input{position:absolute;opacity:0;pointer-events:none}
.reasons span{display:inline-block;border:1px solid var(--line);padding:8px 14px;font-size:.88rem;color:var(--soft);transition:all .15s;letter-spacing:0;text-transform:none}
.reasons input:checked+span{background:var(--accent);border-color:var(--accent);color:#1b1b1b;font-weight:500}
.reasons input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.reasons label:hover span{border-color:var(--accent)}
.cnt{float:right;color:var(--muted);font-size:.78rem;letter-spacing:.04em;text-transform:none}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.fnote{color:var(--muted);font-size:.8rem;margin:2px 0 18px}
.fstat{margin-top:14px;font-size:.92rem}
.fstat.err{color:#ff8f8f;border:1px solid #5a2a2a;background:rgba(255,107,107,.07);padding:12px 14px}
.fstat.err .btn{margin-top:10px}
.cform button[type=submit]{min-width:220px}
.cform button[disabled]{opacity:.6;cursor:progress}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #1b1b1b;border-top-color:transparent;border-radius:50%;margin-right:10px;vertical-align:-2px;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.sent{text-align:center;padding:30px 10px}
.sent .tick{width:84px;height:84px;margin:0 auto 18px;border:2px solid #58e08a;border-radius:50%;display:grid;place-items:center;color:#58e08a;animation:pop .5s cubic-bezier(.22,1,.36,1)}
.sent .tick svg{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .25s forwards}
.sent h3{font-size:2.2rem;margin-bottom:8px}
.sent p{color:var(--soft);max-width:420px;margin:0 auto 20px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.cside{display:grid;gap:22px;align-content:start}
.live{display:inline-flex;align-items:center;gap:10px;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.live i{width:8px;height:8px;border-radius:50%;background:#58e08a;box-shadow:0 0 0 4px rgba(88,224,138,.18)}
.steps{list-style:none;margin:0;padding:0;counter-reset:st;border-top:1px solid var(--line)}
.steps li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--soft);font-size:.94rem}
.steps li::before{content:counter(st);font:400 1.5rem/1 "Bebas Neue",sans-serif;color:var(--accent)}
.steps b{display:block;color:#fff;font-weight:400}
@media (max-width:900px){.cgrid{grid-template-columns:1fr}}
@media (max-width:560px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#splash{display:none}}
/* Compétences */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:30px 40px}
.skills h3{font-size:1.5rem;color:var(--accent);margin-bottom:12px;letter-spacing:.1em}
.skills ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.skills li{padding:7px 0;border-bottom:1px solid var(--line);color:var(--soft)}

/* Contact */
.contact h2{font-size:clamp(2.6rem,7vw,6rem);letter-spacing:.07em;margin-bottom:16px}
.contact p{color:var(--soft);max-width:520px;margin:0 0 30px}
.mailline{margin-top:26px!important;color:#fff!important;font-size:1.05rem}
.mailline #mailText{user-select:all}
footer{border-top:1px solid var(--line);padding-block:30px}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px 30px;align-items:center;justify-content:space-between;color:var(--muted);font-size:.85rem}
footer .logo{font-size:1.5rem}

@media (max-width:860px){
  .herogrid{grid-template-columns:1fr}
  .mock{min-height:0}
  .frame.f2,.frame.f3{display:none}
  .frame.f1{position:relative;width:100%;transform:none}
  .proof{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr}
  .tile{aspect-ratio:16/10}
  .tile.big{grid-column:auto;aspect-ratio:16/10}
  nav a.hide-sm{display:none}
}
@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .tile.big{grid-column:auto;aspect-ratio:1}
  .dhead,.dbody{padding-left:18px;padding-right:18px}
  .svc div{padding-right:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

    <div class="crow"><span class="cic">${ICON_MAIL}</span><div class="ctxt"><small>${esc(u.cEmail)}</small><span>${esc(L.email)}</span></div><a class="btn sm" href="${mailto}">${esc(u.cWrite)}</a><button class="iconbtn" type="button" data-copy="${esc(L.email)}" aria-label="${esc(u.copy)}" title="${esc(u.copy)}">${ICON_COPY}</button></div>
    <div class="crow"><span class="cic">${ICON_IN}</span><div class="ctxt"><small>LinkedIn</small><span>linkedin.com/in/rania-dridi</span></div><a class="btn sm" href="${esc(L.linkedin)}" target="_blank" rel="noopener">${esc(u.cOpen)}</a><button class="iconbtn" type="button" data-copy="${esc(L.linkedin)}" aria-label="${esc(u.copyLink)}" title="${esc(u.copyLink)}">${ICON_COPY}</button></div>
    <div class="crow"><span class="cic">${ICON_TEL}</span><div class="ctxt"><small>${esc(u.cPhone)}</small><span>${esc(L.phoneLabel)}</span></div><a class="btn sm" href="tel:${esc(L.phone)}">${esc(u.cCall)}</a><button class="iconbtn" type="button" data-copy="${esc(L.phoneLabel)}" aria-label="${esc(u.copyPhone)}" title="${esc(u.copyPhone)}">${ICON_COPY}</button></div>`;
  document.getElementById('contactRows').innerHTML = rows;
  document.getElementById('dialogRows').innerHTML = rows;
  const cvBtn = L.cv ? `<a class="btn" href="${esc(L.cv)}" target="_blank" rel="noopener">${esc(u.cvDl)}</a>` : '';
  document.getElementById('dialogBtns').innerHTML = `<a class="btn fill" href="#contact" data-close-contact>${esc(u.f_write)}</a>${cvBtn}`;
  document.getElementById('steps').innerHTML = u.steps.map((x) => `<li><span><b>${esc(x[0])}</b>${esc(x[1])}</span></li>`).join('');
  document.getElementById('cTitle').textContent = u.cTitle;
  document.getElementById('cIntro').textContent = u.cIntro;
  document.getElementById('flinks').innerHTML = `<a href="${esc(L.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>${L.cv ? `<a href="${esc(L.cv)}" target="_blank" rel="noopener">${esc(u.cv)}</a>` : ''}<a href="#portfolio">${esc(u.n_portfolio)}</a>`;
  document.getElementById('proof').innerHTML = u.proof.map((x) => `<div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('');
  document.getElementById('whyList').innerHTML = u.why.map((x) => `<div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('');

  document.getElementById('svc').innerHTML = u.svc.map(s => `<div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('');

  document.getElementById('grid').innerHTML = P.map(p => `
    <button class="tile${p.big?' big':''}" type="button" data-id="${p.id}">
      <span class="art" ${p.bg?`style="background:${p.bg}"`:''}>${art(p)}</span>${p.demo?`<span class="live">${esc(UI[lang].live)}</span>`:''}
      <span class="cap"><small>${esc(p.cat[lang])}</small><h3>${esc(p.t[lang])}</h3></span>
    </button>`).join('');

  document.getElementById('skillGrid').innerHTML = SKILLS.map(s => `<div><h3>${esc(lang==='fr'?s[0]:s[1])}</h3><ul>${s[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
}

function openProject(id){
  const p = P.find(x => x.id === id), u = UI[lang];
  document.getElementById('dTitle').textContent = p.t[lang];
  const media = p.shots
    ? `<div class="shots">${p.shots.map((n,i)=>`<button type="button" class="shot" data-i="${i}" aria-label="${esc(p.t[lang])} ${i+1}"><img src="assets/${esc(n)}.png" alt="${esc(p.t[lang])}" loading="lazy"></button>`).join('')}</div>`
    : (p.img ? `<img class="one" src="${esc(p.img)}" alt="${esc(p.t[lang])}">` : '');
  document.getElementById('dBody').innerHTML = `
    ${p.demo ? `<div class="demo"><a class="btn fill" href="${esc(p.demo)}" target="_blank" rel="noopener">${esc(u.demo)} →</a>${p.demoHint ? `<p>${esc(p.demoHint[lang])}</p>` : ''}</div>` : ''}
    ${media}
    <p>${esc(p.d[lang])}</p>
    ${p.b ? `<ul>${p.b[lang].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    <div class="pills">${p.tech.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>
    <div class="meta">
      <div><small>${esc(u.cat)}</small><span>${esc(p.cat[lang])}</span></div>
      <div><small>${esc(u.date)}</small><span>${esc(p.date[lang])}</span></div>
      <div><small>${esc(u.ctx)}</small><span>${esc(p.client)}</span></div>
    </div>`;
  document.querySelectorAll('#dBody .shot').forEach((b) => b.addEventListener('click', () => openLightbox(p.shots.map((n) => `assets/${n}.png`), Number(b.dataset.i))));
  const d = document.getElementById('dlg');
  if (d.showModal) d.showModal(); else d.setAttribute('open','');
}

// Full-screen viewer for screenshots: arrows, Escape and click outside to close.
let lbList = []; let lbIndex = 0;
function showLightbox() { document.getElementById('lbImg').src = lbList[lbIndex]; document.getElementById('lbCount').textContent = `${lbIndex + 1} / ${lbList.length}`; }
function openLightbox(list, index) {
  lbList = list; lbIndex = index; showLightbox();
  const lb = document.getElementById('lb');
  if (lb.showModal) lb.showModal(); else lb.setAttribute('open','');
}
const stepLightbox = (delta) => { lbIndex = (lbIndex + delta + lbList.length) % lbList.length; showLightbox(); };
document.getElementById('lbPrev').onclick = () => stepLightbox(-1);
document.getElementById('lbNext').onclick = () => stepLightbox(1);
document.getElementById('lbClose').onclick = () => document.getElementById('lb').close();
document.getElementById('lb').addEventListener('click', (e) => { if (e.target.id === 'lb') e.currentTarget.close(); });
document.getElementById('lb').addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') stepLightbox(1); if (e.key === 'ArrowLeft') stepLightbox(-1); });


document.getElementById('grid').addEventListener('click', e => {
  const b = e.target.closest('.tile'); if (b) openProject(b.dataset.id);
});
const dlg = document.getElementById('dlg');
document.getElementById('dClose').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
document.getElementById('lang').onclick = () => {
  lang = lang === 'fr' ? 'en' : 'fr';
  try { localStorage.setItem('lang', lang); } catch(e){}
  render();
};
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back below */ }
  try {
    const t = document.createElement('textarea');
    t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok;
  } catch (e) { return false; }
}
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-copy]');
  if (btn) {
    if (await copyText(btn.dataset.copy)) {
      btn.innerHTML = ICON_OK; btn.classList.add('ok'); btn.dataset.tip = UI[lang].copied;
      setTimeout(() => { btn.innerHTML = ICON_COPY; btn.classList.remove('ok'); }, 1600);
    }
    return;
  }
  if (e.target.closest('#hireTop, #hire, [data-open-contact]')) {
    const c = document.getElementById('cdlg');
    if (c.showModal) c.showModal(); else c.setAttribute('open', '');
  }
});
document.getElementById('cClose').onclick = () => document.getElementById('cdlg').close();
document.getElementById('cdlg').addEventListener('click', (e) => { if (e.target.id === 'cdlg') e.currentTarget.close(); });
// ---- Contact form -------------------------------------------------------------------
const form = document.getElementById('cform');
const cMsg = document.getElementById('cMsg');
cMsg.addEventListener('input', () => { document.getElementById('cnt').textContent = `${cMsg.value.length} / 1000`; });
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-close-contact]')) { document.getElementById('cdlg').close(); }
});

function fieldError(name, text) {
  const box = form.querySelector(`[data-f="${name}"]`);
  box.classList.toggle('bad', !!text);
  box.querySelector('.ferr').textContent = text || '';
}
function validateForm() {
  const u = UI[lang];
  const name = form.name.value.trim(), email = form.email.value.trim(), msg = form.message.value.trim();
  fieldError('name', name.length < 2 ? u.e_name : '');
  fieldError('email', /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? '' : u.e_email);
  fieldError('message', msg.length < 20 ? u.e_msg : '');
  const first = form.querySelector('.fld.bad input, .fld.bad textarea');
  if (first) { first.focus(); return false; }
  return true;
}
['name', 'email', 'message'].forEach((n) => form[n].addEventListener('input', () => { if (form.querySelector(`[data-f="${n}"].bad`)) validateForm(); }));

function formPayload() {
  const u = UI[lang];
  const reasonEl = form.querySelector('input[name=reason]:checked');
  const reason = reasonEl.nextElementSibling.textContent;
  const role = form.role.options[form.role.selectedIndex].textContent;
  return {
    name: form.name.value.trim(), email: form.email.value.trim(), company: form.company.value.trim(), role, reason,
    message: form.message.value.trim(), _subject: `Portfolio : ${reason} (${form.name.value.trim()})`,
    _template: 'table', _captcha: 'false', _honey: form._honey.value,
  };
}

function showSent() {
  const u = UI[lang];
  form.innerHTML = `<div class="sent"><div class="tick"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg></div>
    <h3>${esc(u.f_ok_t)}</h3><p>${esc(u.f_ok_p)}</p><button class="btn" type="button" id="again">${esc(u.f_again)}</button></div>`;
  document.getElementById('again').onclick = () => location.reload();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const u = UI[lang];
  const status = document.getElementById('cStatus');
  status.className = 'fstat'; status.textContent = '';
  if (!validateForm()) return;
  const data = formPayload();
  if (data._honey) { showSent(); return; } // bots fill the hidden field: pretend success
  const btn = document.getElementById('cSend');
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${esc(u.f_sending)}`;
  try {
    const res = await fetch(L.form, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(data) });
    const body = await res.json().catch(() => ({}));
    if (!res.ok || String(body.success) === 'false') throw new Error(body.message || 'failed');
    showSent();
  } catch (err) {
    btn.disabled = false; btn.textContent = u.f_send;
    const href = `mailto:${L.email}?subject=${encodeURIComponent(data._subject)}&body=${encodeURIComponent(data.message + '\n\n' + data.name + ' <' + data.email + '>')}`;
    status.className = 'fstat err';
    status.innerHTML = `${esc(u.f_err)}<br><a class="btn sm" href="${href}">${esc(u.f_mailfb)}</a>`;
  }
});

// ---- Intro splash: RD monogram, then the page slides up ----------------------------------
(function splash() {
  const el = document.getElementById('splash');
  if (!el) return;
  let seen = false;
  try { seen = sessionStorage.getItem('rd-splash') === '1'; } catch (e) { /* ignore */ }
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (seen || reduced) { el.remove(); return; }
  document.body.classList.add('splashing');
  let done = false;
  const finish = () => {
    if (done) return; done = true;
    try { sessionStorage.setItem('rd-splash', '1'); } catch (e) { /* ignore */ }
    el.classList.add('out');
    setTimeout(() => { el.remove(); document.body.classList.remove('splashing'); }, 800);
  };
  setTimeout(finish, 1700);
  el.addEventListener('click', finish);
  window.addEventListener('keydown', finish, { once: true });
})();

document.getElementById('yr').textContent = new Date().getFullYear();
render();
</script>
