<style>
/* Concept : agence digitale. Fond encre, titres XXL, un seul accent corail, cartes projets à vignette */
:root{
  color-scheme:dark;
  --bg:#0d0d12; --bg-2:#14141b; --card:#191922; --line:#2a2a36;
  --text:#f4f1ea; --muted:#a3a3b3; --accent:#ff5b3a; --accent-2:#ff7d62; --on-accent:#16110f;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;line-height:1.08;margin:0;text-wrap:balance}
a{color:var(--accent-2)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a,button,.proj{transition:background-color .15s,border-color .15s,transform .15s,color .15s}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(13,13,18,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font:800 1.05rem "Bricolage Grotesque",sans-serif}
.logo i{font-style:normal;display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.85rem}
nav{display:flex;align-items:center;gap:22px}
nav a{color:var(--muted);text-decoration:none;font-size:.95rem}
nav a:hover{color:var(--text)}
.chip{border:1px solid var(--line);background:var(--bg-2);color:var(--text);border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit;font-size:.85rem}
.chip:hover{border-color:var(--accent)}

.btn{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600;border:1px solid var(--accent);cursor:pointer;font-family:inherit;font-size:1rem}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-2)}
.btns{display:flex;flex-wrap:wrap;gap:12px}

/* Hero */
.hero{padding-block:84px 64px;display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:center}
.eyebrow{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.85rem;color:var(--muted);margin-bottom:20px}
.eyebrow b{color:var(--accent-2);font-weight:600}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:800;letter-spacing:-.02em;margin-bottom:20px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--muted);max-width:540px;margin:0 0 28px;font-size:1.08rem}
.portrait{aspect-ratio:1;max-width:340px;width:100%;margin-inline:auto;border-radius:36px;background:linear-gradient(150deg,#ff5b3a 0%,#b53a22 100%);display:grid;place-items:center;font:800 5.5rem "Bricolage Grotesque",sans-serif;color:var(--on-accent);overflow:hidden;position:relative}
.portrait img{width:100%;height:100%;object-fit:cover}

section{padding-block:60px}
.head{margin-bottom:28px}
.head h2{font-size:clamp(1.8rem,4.5vw,2.8rem);font-weight:800;letter-spacing:-.01em}
.head p{color:var(--muted);margin:8px 0 0;max-width:560px}
.kicker{color:var(--accent-2);font-weight:600;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:block}

/* Services */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.svc div{background:var(--bg-2);border:1px solid var(--line);border-radius:20px;padding:24px}
.svc div:hover{border-color:var(--accent)}
.svc b{display:block;font:700 1.15rem "Bricolage Grotesque",sans-serif;margin-bottom:8px}
.svc span{color:var(--muted);font-size:.97rem}

/* Grille de projets */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.proj{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;padding:0;text-align:left;color:inherit;font:inherit;display:flex;flex-direction:column}
.proj:hover{border-color:var(--accent);transform:translateY(-3px)}
.thumb{aspect-ratio:16/10;width:100%;display:grid;place-items:center;overflow:hidden;font:800 2.2rem "Bricolage Grotesque",sans-serif;color:#fff}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.proj .body{padding:18px 20px 22px;display:grid;gap:4px}
.proj .type{color:var(--accent-2);font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.proj h3{font-size:1.25rem}
.proj .sub{color:var(--muted);font-size:.93rem}
.proj.big{grid-column:1/-1;flex-direction:row}
.proj.big .thumb{aspect-ratio:auto;width:56%;min-height:300px}
.proj.big .body{align-content:center;padding:28px;gap:10px}
.proj.big h3{font-size:clamp(1.6rem,3vw,2.2rem)}

/* Détail projet */
dialog{border:1px solid var(--line);background:var(--bg-2);color:var(--text);border-radius:24px;padding:0;width:min(860px,calc(100% - 24px));max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.72)}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 28px 0}
.dhead h3{font-size:1.8rem}
.x{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:1.1rem;flex:none}
.x:hover{border-color:var(--accent)}
.dbody{padding:14px 28px 30px;display:grid;gap:16px}
.dbody p{margin:0;color:var(--muted)}
.dbody ul{margin:0;padding-left:20px;color:var(--text)}
.dbody li{margin-bottom:6px}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.shots img,.dbody .one{width:100%;display:block;border-radius:12px;border:1px solid var(--line)}
.dbody .one{max-width:640px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;border-top:1px solid var(--line);padding-top:16px}
.meta div small{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.meta div span{font-weight:600}

/* Compétences */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.skills>div{border:1px solid var(--line);background:var(--bg-2);border-radius:20px;padding:20px}
.skills b{display:block;color:var(--accent-2);font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.9rem;background:var(--card)}

/* Contact */
.contact{border:1px solid var(--line);background:linear-gradient(160deg,#1b1b25,#15151d);border-radius:32px;padding:clamp(28px,6vw,60px);text-align:center}
.contact h2{font-size:clamp(1.9rem,5vw,3.2rem);font-weight:800;margin-bottom:12px}
.contact p{color:var(--muted);margin:0 auto 24px;max-width:520px}
.contact .btns{justify-content:center}
.mailline{margin:22px 0 0!important;color:var(--text)!important;font-weight:600}
.mailline #mailText{user-select:all}
footer{border-top:1px solid var(--line);padding-block:26px;color:var(--muted);font-size:.9rem}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding-block:48px 36px}
  .portrait{max-width:220px;font-size:3.6rem;border-radius:28px;margin-inline:0}
  nav a.hide-sm{display:none}
  .proj.big{flex-direction:column}
  .proj.big .thumb{width:100%;min-height:0;aspect-ratio:16/10}
  .dhead,.dbody{padding-left:18px;padding-right:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>

function thumb(p){

      <div><small>${esc(u.ctx)}</small><span>${esc(p.client)}</span></div>
    </div>`;
  const dlg = document.getElementById('dlg');
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
}

document.getElementById('grid').addEventListener('click', e => {
  const b = e.target.closest('.proj'); if (b) openProject(b.dataset.id);
});
const dlg = document.getElementById('dlg');
document.getElementById('dClose').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

document.getElementById('lang').onclick = () => {
  lang = lang === 'fr' ? 'en' : 'fr';
  try { localStorage.setItem('lang', lang); } catch(e){}
  render();
};
document.getElementById('copyMail').addEventListener('click', async () => {
  const el = document.getElementById('copyMail');
  try { await navigator.clipboard.writeText(L.email); el.textContent = UI[lang].copied; }
  catch(e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('mailText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
});
document.getElementById('yr').textContent = new Date().getFullYear();
render();
</script>

</body>
</html>
